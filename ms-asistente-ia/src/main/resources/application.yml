server:
  port: ${SERVER_PORT:8089}

spring:
  application:
    name: ms-asistente-ia
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  # Credenciales de la base de datos: se leen del archivo .env (DB_URL, DB_USER, DB_PASSWORD).
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DB_URL}}
    username: ${DB_USER:${DB_USERNAME}}
    password: ${DB_PASSWORD}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:${DB_DRIVER:org.postgresql.Driver}}
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:3}
      minimum-idle: ${DB_MIN_IDLE:1}
      connection-timeout: ${DB_CONNECTION_TIMEOUT:10000}
      idle-timeout: ${DB_IDLE_TIMEOUT:60000}
      max-lifetime: ${DB_MAX_LIFETIME:120000}
      pool-name: MSAsistenteIaHikariPool
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:${JPA_DDL_AUTO:none}}
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true
    show-sql: false
    open-in-view: false
  jackson:
    property-naming-strategy: SNAKE_CASE

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  auth:
    default-user-id: 00000000-0000-0000-0000-000000000001
  gemini:
    # La key se lee de la variable de entorno GEMINI_API_KEY (archivo .env, que no se sube a git).
    api-key: ${GEMINI_API_KEY:}
    # Por defecto usa gemini-3.5-flash-lite para baja latencia y evitar timeouts del gateway.
    model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
    timeout-seconds: ${GEMINI_TIMEOUT_SECONDS:110}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui
    operations-sorter: method
